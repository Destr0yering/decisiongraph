name: Deploy public judge demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static judge demo
        run: |
          mkdir -p _site/assets
          cp backend/app/static/index.html _site/index.html
          cp backend/app/static/dashboard.css _site/assets/dashboard.css
          cp backend/app/static/dashboard.js _site/assets/dashboard.js
          cp backend/app/static/static-demo.js _site/assets/static-demo.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
