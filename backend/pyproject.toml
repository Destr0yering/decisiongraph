[project]
name = "decisiongraph-api"
version = "0.2.0"
description = "Decision lineage and recall API for DataHub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx2>=2,<3",
    "fastmcp>=3.2,<4",
    "uv>=0.11,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
